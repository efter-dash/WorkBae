name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - name: Build and package
        run: |
          chmod +x scripts/*.command
          ./scripts/package-release.command
          lipo outputs/WorkBae.app/Contents/MacOS/WorkBae -verify_arch arm64 x86_64
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          outputs/WorkBae-macOS-*.zip
          --title "WorkBae $GITHUB_REF_NAME"
          --generate-notes
